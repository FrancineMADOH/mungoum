name: mungoum
description: "Calendrier Nguemba — Mungoum"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^5.1.0
  intl: ^0.19.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_launcher.png"
  background_color: "#1A2F6E"
  adaptive_icon_background: "#1A2F6E"
  adaptive_icon_foreground: "assets/images/logo_launcher.png"
  remove_alpha_ios: true
  min_sdk_android: 21
