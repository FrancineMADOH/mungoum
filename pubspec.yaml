name: mungoum
description: "Calendrier Nguemba — Mungoum"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^5.1.0
  intl: ^0.19.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  # google_fonts fetches fonts at runtime in debug mode,
  # and bundles them in release builds via the package itself.
